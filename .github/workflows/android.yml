
name: PHOTO NOVA Android APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare App
        run: |
          mkdir -p www
          cp index.html style.css filters.js app.js www/
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Configure Capacitor
        run: |
          npx cap init "PHOTO NOVA" "com.gokul.photonova" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-NOVA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

